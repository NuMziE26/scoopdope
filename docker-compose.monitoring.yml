version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: handsoff-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
